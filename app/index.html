<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caso Universidad</title>
  <style>
    :root { --rojo: #9e1c24; --rojo-oscuro: #7d151c; --amarillo: #f2c200; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: var(--rojo); color: #fff; padding: 14px 20px; border-bottom: 4px solid var(--amarillo); box-shadow: 0 6px 0 #111; margin-bottom: 6px; }
    header h1 { margin: 0 0 8px; font-size: 20px; }
    nav button { background: none; border: 1px solid #fff6; color: #fff; padding: 6px 12px; margin: 2px; border-radius: 6px; cursor: pointer; }
    nav button.activo { background: var(--amarillo); color: #111; border-color: var(--amarillo); }
    main { padding: 20px; max-width: 1100px; margin: auto; }
    #aviso { display: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    #aviso.ok { display: block; background: #d9f2df; color: #155724; }
    #aviso.error { display: block; background: #f8d7da; color: #721c24; }
    form { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
    input, select { padding: 6px; border: 1px solid #bbb; border-radius: 4px; }
    button { padding: 6px 12px; border: 0; border-radius: 4px; background: var(--rojo); color: #fff; cursor: pointer; }
    button:hover { background: var(--rojo-oscuro); }
    h2 { color: var(--rojo); }
    button.secundario { background: #888; }
    button.peligro { background: #333; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
    th { background: #fdf3cc; border-bottom: 2px solid var(--amarillo); }
    td input { width: 60px; }
    .tabla { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Caso Universidad</h1>
    <nav id="menu"></nav>
  </header>
  <main>
    <div id="aviso"></div>
    <div id="contenido"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
